name: donato_valerie
description: "Local operations workflow app for DONATO VALERIE."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - docs/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "docs/icon.png"
  adaptive_icon_background: "#071428"
  adaptive_icon_foreground: "docs/icon.png"
